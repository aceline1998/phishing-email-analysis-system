{% extends 'base.html' %}

{% block title %}任务队列状态{% endblock %}

{% block content %}
<div class="page-header">
    <h1>📋 任务队列实时状态</h1>
    <p>实时监控邮件分析任务的处理进度</p>
</div>

<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:24px;">
    <div class="stat-card">
        <div class="stat-icon" style="background:rgba(0,212,255,0.1);color:#00d4ff;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="20" x2="12" y2="10"></line>
                <line x1="18" y1="20" x2="18" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="16"></line>
            </svg>
        </div>
        <div class="stat-value" id="stat-pending">0</div>
        <div class="stat-label">待分析</div>
    </div>
    <div class="stat-card">
        <div class="stat-icon" style="background:rgba(255,152,0,0.1);color:#ff9800;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"></path>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
        </div>
        <div class="stat-value" id="stat-processing">0</div>
        <div class="stat-label">分析中</div>
    </div>
    <div class="stat-card">
        <div class="stat-icon" style="background:rgba(0,255,136,0.1);color:#00ff88;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 6L9 17l-5-5"></path>
            </svg>
        </div>
        <div class="stat-value" id="stat-analyzed">0</div>
        <div class="stat-label">待回复邮件</div>
    </div>
    <div class="stat-card">
        <div class="stat-icon" style="background:rgba(102,187,106,0.1);color:#66bb6a;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
        </div>
        <div class="stat-value" id="stat-replied">0</div>
        <div class="stat-label">已回复邮件</div>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <span class="card-title">任务列表</span>
        <div style="display:flex;gap:8px;">
            <button class="btn btn-primary" onclick="loadTaskStatus()">刷新状态</button>
            <button class="btn" onclick="loadTaskList('all')">全部</button>
            <button class="btn" onclick="loadTaskList('pending')">待分析</button>
            <button class="btn" onclick="loadTaskList('processing')">分析中</button>
            <button class="btn" onclick="loadTaskList('analyzed')">待回复</button>
            <button class="btn" onclick="loadTaskList('replied')">已回复</button>
        </div>
    </div>
    <div class="card-body">
        <table class="data-table">
            <thead>
                <tr>
                    <th>邮件主题</th>
                    <th>发件人</th>
                    <th>状态</th>
                    <th>创建时间</th>
                    <th>更新时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="task-list-body">
            </tbody>
        </table>
        <div id="task-empty" style="display:none;text-align:center;padding:40px;color:#888;">
            暂无任务
        </div>
    </div>
</div>

<div class="card" style="margin-top:20px;">
    <div class="card-header">
        <span class="card-title">任务趋势</span>
    </div>
    <div class="card-body">
        <div style="height:200px;" id="task-trend-chart"></div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
.stat-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: all 0.3s;
}
.stat-card:hover {
    background: rgba(255,255,255,0.05);
    transform: translateY(-2px);
}
.stat-icon {
    width: 56px;
    height: 56px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}
.stat-value {
    font-size: 28px;
    font-weight: bold;
    color: #fff;
}
.stat-label {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 4px;
}
.status-badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
}
.status-pending { background: rgba(0,212,255,0.1); color: #00d4ff; }
.status-processing { background: rgba(255,152,0,0.1); color: #ff9800; }
.status-analyzed { background: rgba(0,255,136,0.1); color: #00ff88; }
.status-replied { background: rgba(102,187,106,0.1); color: #66bb6a; }
.status-failed { background: rgba(255,107,107,0.1); color: #ff6b6b; }
.data-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 13px;
}
.data-table th, .data-table td {
    padding: 12px 16px;
    text-align: left;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    white-space: nowrap;
}
.data-table th {
    background: rgba(0,212,255,0.05);
    color: var(--text-secondary);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
.data-table th:first-child { border-top-left-radius: 8px; }
.data-table th:last-child { border-top-right-radius: 8px; }
.data-table tr:hover {
    background: rgba(255,255,255,0.02);
}
.data-table td {
    color: var(--text-primary);
}
.data-table td:first-child {
    max-width: 250px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.data-table td:nth-child(2) {
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
</style>
{% endblock %}

{% block extra_js %}
<script>
let currentFilter = 'all';

async function apiRequest(url, options = {}) {
    const resp = await fetch(url, {
        credentials: 'same-origin',
        ...options,
        headers: { 'Content-Type': 'application/json', ...options.headers }
    });
    if (!resp.ok) throw new Error(await resp.text());
    return resp.json();
}

async function loadTaskStatus() {
    try {
        const stats = await apiRequest('/api/task-queue/status');
        document.getElementById('stat-pending').textContent = stats.pending || 0;
        document.getElementById('stat-processing').textContent = stats.processing || 0;
        document.getElementById('stat-analyzed').textContent = stats.analyzed || 0;
        document.getElementById('stat-replied').textContent = stats.replied || 0;
    } catch (e) {
        console.log('加载任务状态失败:', e.message);
    }
}

async function loadTaskList(filter) {
    currentFilter = filter;
    try {
        const params = new URLSearchParams();
        if (filter !== 'all') params.set('status', filter);
        const tasks = await apiRequest(`/api/task-queue/tasks?${params.toString()}`);
        renderTaskList(tasks);
    } catch (e) {
        console.log('加载任务列表失败:', e.message);
    }
}

function renderTaskList(tasks) {
    const tbody = document.getElementById('task-list-body');
    const empty = document.getElementById('task-empty');
    
    if (!tasks || tasks.length === 0) {
        tbody.innerHTML = '';
        empty.style.display = 'block';
        return;
    }
    
    empty.style.display = 'none';
    tbody.innerHTML = tasks.map(task => {
        const statusMap = {
            'pending': { label: '待分析', cls: 'status-pending' },
            'processing': { label: '分析中', cls: 'status-processing' },
            'analyzed': { label: '待回复', cls: 'status-analyzed' },
            'replied': { label: '已回复', cls: 'status-replied' },
            'failed': { label: '失败', cls: 'status-failed' }
        };
        const status = statusMap[task.status] || { label: task.status, cls: '' };
        
        return `<tr>
            <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${task.subject}">${task.subject}</td>
            <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${task.sender}">${task.sender}</td>
            <td><span class="status-badge ${status.cls}">${status.label}</span></td>
            <td>${task.created_at}</td>
            <td>${task.updated_at}</td>
            <td>
                <button class="btn btn-sm" onclick="viewTaskDetail(${task.id})">查看</button>
            </td>
        </tr>`;
    }).join('');
}

function viewTaskDetail(taskId) {
    window.location.href = `/email/${taskId}`;
}

async function loadTaskTrend() {
    try {
        const trend = await apiRequest('/api/task-queue/trend');
        renderTrendChart(trend);
    } catch (e) {
        console.log('加载趋势失败:', e.message);
    }
}

function renderTrendChart(trend) {
    const container = document.getElementById('task-trend-chart');
    if (!trend || trend.length === 0) {
        container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#888;">暂无趋势数据</div>';
        return;
    }
    
    const maxCount = Math.max(...trend.map(t => t.count || 0), 1);
    const barWidth = 40;
    const gap = 20;
    const chartWidth = trend.length * (barWidth + gap);
    const chartHeight = 160;
    
    let svgHtml = `<svg viewBox="0 0 ${chartWidth} ${chartHeight}" style="width:100%;height:100%;">`;
    
    trend.forEach((item, index) => {
        const x = index * (barWidth + gap);
        const barHeight = (item.count / maxCount) * 120;
        const y = chartHeight - barHeight - 20;
        
        let color = '#00d4ff';
        if (item.status === 'processing') color = '#ff9800';
        else if (item.status === 'analyzed') color = '#00ff88';
        else if (item.status === 'replied') color = '#66bb6a';
        
        svgHtml += `<rect x="${x}" y="${y}" width="${barWidth}" height="${barHeight}" fill="${color}" rx="4"/>`;
        svgHtml += `<text x="${x + barWidth/2}" y="${chartHeight - 5}" text-anchor="middle" fill="#888" font-size="10">${item.hour}</text>`;
    });
    
    svgHtml += '</svg>';
    container.innerHTML = svgHtml;
}

document.addEventListener('DOMContentLoaded', function() {
    loadTaskStatus();
    loadTaskList('all');
    loadTaskTrend();
    
    setInterval(loadTaskStatus, 5000);
});
</script>
{% endblock %}
